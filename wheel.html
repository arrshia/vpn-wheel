<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>چرخ شانس</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--tg-theme-bg-color, #1a1a2e);
            color: var(--tg-theme-text-color, #eee);
            font-family: Tahoma, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 20px;
            padding: 20px;
        }

        h1 {
            font-size: 1.4rem;
        }

        #wheel-wrap {
            position: relative;
            width: min(320px, 90vw);
            height: min(320px, 90vw);
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        #pointer {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 26px solid #f39c12;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .5));
        }

        #spin-btn {
            background: #f39c12;
            color: #fff;
            border: none;
            padding: 14px 48px;
            border-radius: 32px;
            font-size: 1.1rem;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(243, 156, 18, .45);
            transition: transform .1s, opacity .2s;
        }

        #spin-btn:active {
            transform: scale(.96);
        }

        #spin-btn:disabled {
            opacity: .45;
            cursor: default;
        }

        #msg {
            font-size: .95rem;
            min-height: 22px;
            color: var(--tg-theme-hint-color, #aaa);
        }
    </style>
</head>

<body>

    <h1>🎡 چرخ شانس هفتگی</h1>

    <div id="wheel-wrap">
        <div id="pointer"></div>
        <canvas id="c" width="600" height="600"></canvas>
    </div>

    <button id="spin-btn">بچرخون!</button>
    <p id="msg">هر هفته یک اسپین رایگان داری</p>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        // Segment order must match PRIZES list in services/wheel.py (idx 0-5)
        const SEGS = [{
                label: "شانس بعدی 🤞",
                color: "#2c3e50"
            },
            {
                label: "۵٬۰۰۰ تومان 💰",
                color: "#27ae60"
            },
            {
                label: "۱۰٬۰۰۰ تومان 💰",
                color: "#2980b9"
            },
            {
                label: "تخفیف ۱۰٪ 🎫",
                color: "#8e44ad"
            },
            {
                label: "۲۵٬۰۰۰ تومان 💰",
                color: "#e67e22"
            },
            {
                label: "کانفیگ رایگان 🎁",
                color: "#c0392b"
            },
        ];

        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d");
        const N = SEGS.length;
        const ARC = (2 * Math.PI) / N;
        let angle = 0;
        let spinning = false;

        function draw(a) {
            const cx = canvas.width / 2,
                cy = canvas.height / 2,
                r = cx - 6;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < N; i++) {
                const s = a + i * ARC,
                    e = s + ARC;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, s, e);
                ctx.closePath();
                ctx.fillStyle = SEGS[i].color;
                ctx.fill();
                ctx.strokeStyle = "rgba(255,255,255,.25)";
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(s + ARC / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 22px Tahoma";
                ctx.shadowColor = "rgba(0,0,0,.5)";
                ctx.shadowBlur = 4;
                ctx.fillText(SEGS[i].label, r - 16, 8);
                ctx.restore();
            }

            // Hub
            ctx.beginPath();
            ctx.arc(cx, cy, 28, 0, 2 * Math.PI);
            ctx.fillStyle = "#f39c12";
            ctx.fill();
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        draw(0);

        document.getElementById("spin-btn").addEventListener("click", () => {
            if (spinning) return;
            spinning = true;
            document.getElementById("spin-btn").disabled = true;
            document.getElementById("msg").textContent = "در حال چرخش...";

            const rotations = (6 + Math.random() * 6) * 2 * Math.PI;
            const duration = 4200;
            const t0 = performance.now();
            const a0 = angle;

            function easeOut(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            function frame(now) {
                const t = Math.min((now - t0) / duration, 1);
                angle = a0 + rotations * easeOut(t);
                draw(angle);
                if (t < 1) {
                    requestAnimationFrame(frame);
                } else {
                    // Animation done → hand off to server
                    Telegram.WebApp.sendData("spin");
                }
            }
            requestAnimationFrame(frame);
        });
    </script>
</body>

</html>
